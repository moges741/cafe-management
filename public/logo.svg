<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Arches for Text -->
    <path id="top-arch" d="M 100,250 A 150,150 0 0,1 400,250" />
    <path id="bottom-arch" d="M 400,260 A 150,150 0 0,1 100,260" />
  </defs>

  <!-- Outer Rings (Transparent Background) -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#2A1610" stroke-width="12" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="#D4AF37" stroke-width="4" />

  <!-- Top Text (Golden) -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#D4AF37" letter-spacing="4">
    <textPath href="#top-arch" startOffset="50%" text-anchor="middle">
      MR. CAFE
    </textPath>
  </text>

  <!-- Bottom Text (Warm Beige for high visibility) -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#E8C396" letter-spacing="6">
    <textPath href="#bottom-arch" startOffset="50%" text-anchor="middle">
      EST. COFFEE HOUSE
    </textPath>
  </text>

  <!-- === CENTER ARTWORK === -->
  
  <!-- Chef's Hat (Cap) -->
  <g stroke="#2A1610" stroke-width="5" stroke-linejoin="round">
    <!-- Puffy part of the hat -->
    <path d="M 210,135 C 190,95 230,75 250,95 C 270,75 310,95 290,135 Z" fill="#FFFFFF" />
    <!-- Hat band -->
    <rect x="210" y="125" width="80" height="20" rx="4" fill="#FFFFFF" />
  </g>

  <!-- Smiling Chef Face -->
  <circle cx="250" cy="190" r="45" fill="#E8C396" stroke="#2A1610" stroke-width="5"/>
  <!-- Eyes -->
  <circle cx="230" cy="180" r="7" fill="#2A1610"/>
  <circle cx="270" cy="180" r="7" fill="#2A1610"/>
  <!-- Wide Smile -->
  <path d="M 220,205 Q 250,235 280,205" fill="none" stroke="#2A1610" stroke-width="7" stroke-linecap="round"/>

  <!-- Steam (Golden) -->
  <path d="M 235,280 Q 220,255 235,245" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>
  <path d="M 265,280 Q 280,255 265,245" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>
  <path d="M 250,285 Q 250,260 250,240" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>

  <!-- Coffee Cup -->
  <g>
    <!-- Cup Body (Espresso with Golden rim) -->
    <path d="M 175,290 L 325,290 C 325,350 295,375 250,375 C 205,375 175,350 175,290 Z" fill="#2A1610" stroke="#D4AF37" stroke-width="4" stroke-linejoin="round"/>
    <!-- Cup Inside/Opening -->
    <ellipse cx="250" cy="290" rx="75" ry="15" fill="#1A0D09" stroke="#D4AF37" stroke-width="4"/>
    
    <!-- Cup Handle Base (Espresso) -->
    <path d="M 320,315 C 370,310 365,360 305,360" fill="none" stroke="#2A1610" stroke-width="14" stroke-linecap="round"/>
    <!-- Cup Handle Highlight (Gold) -->
    <path d="M 320,315 C 370,310 365,360 305,360" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Decorative Golden Dots -->
  <circle cx="120" cy="255" r="6" fill="#D4AF37" />
  <circle cx="380" cy="255" r="6" fill="#D4AF37" />
</svg>
