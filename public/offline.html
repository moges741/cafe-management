<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | Mr. Cafe</title>
  <meta name="theme-color" content="#050505" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #050505;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
    /* Background Glow Effects */
    .glow-amber {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: rgba(245, 158, 11, 0.12);
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .icon-box {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
    }
    .icon-box svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.925rem;
      color: #a3a3a3;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 9999px;
      color: #f87171;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
    }
    .btn-retry {
      width: 100%;
      padding: 0.875rem;
      background-color: #f59e0b;
      color: #050505;
      font-weight: 800;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }
    .btn-retry:hover {
      background-color: #d97706;
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="glow-amber"></div>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span> No Network Connection
    </div>
    <div class="icon-box">
      <!-- Coffee Cup / Wifi Off Combined SVG -->
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829M1 1l22 22M17 11.5a4.5 4.5 0 00-4.5-4.5H5v9a4.5 4.5 0 004.5 4.5h4a4.5 4.5 0 004.5-4.5v-4.5z" />
      </svg>
    </div>
    <h1>You are currently offline</h1>
    <p>Mr. Cafe requires an active connection to fetch real-time orders, process payments, and update live kitchen queues. Please check your internet connection.</p>
    <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
